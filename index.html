<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Abrir o app Calorias</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6fbf7; --fg: #17301f; --muted: #4a6252; --accent: #2e7d4f; --on-accent: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #101a13; --fg: #e4efe7; --muted: #a3b8a9; --accent: #7fd39b; --on-accent: #0b1f12; }
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 22rem; padding: 24px; text-align: center; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    a.button {
      display: block; padding: 14px 20px; border-radius: 999px;
      background: var(--accent); color: var(--on-accent);
      font-weight: 600; text-decoration: none;
    }
    small { display: block; margin-top: 24px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Quase lá!</h1>
    <p>Toque no botão para continuar no app Calorias.</p>
    <a id="open" class="button" href="#">Abrir no app</a>
    <small>Se nada acontecer, abra este e-mail no mesmo celular em que o app está instalado.</small>
  </main>
  <script>
    // Repassa ao app o que o Supabase anexou ao link (?code=... ou #access_token=...).
    // O destino é fixo; só a query e o fragmento são copiados, como texto.
    var target = "br.com.charles.calorias://login-callback" + location.search + location.hash;
    var button = document.getElementById("open");
    button.setAttribute("href", target);
    // Alguns navegadores permitem abrir sozinho; o botão cobre os que exigem um toque.
    setTimeout(function () { window.location.href = target; }, 300);
  </script>
</body>
</html>
